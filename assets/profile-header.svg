<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ulvin Najafov</title>
  <desc id="desc">Full-stack development, AI, robotics, and open source</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.52" stop-color="#86efac"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#34d399" stop-opacity=".28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.6s ease-in-out 1.2s infinite; transform-origin: center; }
      .dash { stroke-dasharray: 9 13; animation: flow 9s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes flow { to { stroke-dashoffset:-220 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="945" cy="155" rx="310" ry="220" fill="url(#halo)"/>

  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".38">
    <path class="dash" d="M0 252H170L214 208H330"/>
    <path class="dash" d="M1200 64H1040L994 110H876"/>
    <path d="M780 252h92l33-33h118l42-42h135"/>
    <path d="M0 78h125l42 42h137"/>
  </g>

  <g transform="translate(902 70)" filter="url(#glow)">
    <circle cx="105" cy="90" r="76" fill="#07111f" stroke="#5eead4" stroke-width="2" opacity=".9"/>
    <circle cx="105" cy="90" r="50" fill="none" stroke="#86efac" stroke-opacity=".42"/>
    <path d="M72 92l22 22 45-50M50 90h18m74 0h18M105 35v18m0 74v18" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="46" cy="47" r="5" fill="#2dd4bf"/>
    <circle class="pulse2" cx="164" cy="50" r="5" fill="#38bdf8"/>
    <circle class="pulse" cx="158" cy="139" r="5" fill="#86efac"/>
    <circle class="pulse2" cx="49" cy="138" r="5" fill="#5eead4"/>
    <path d="M46 47L78 68M164 50l-32 20M158 139l-28-23M49 138l30-22" stroke="#67e8f9" stroke-opacity=".5"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="82" y="116" fill="#94a3b8" font-size="17" letter-spacing="5">FULL-STACK DEVELOPER  •  SYSTEM BUILDER</text>
    <text x="78" y="179" fill="url(#accent)" font-size="58" font-weight="800" letter-spacing="1.5">ULVIN NAJAFOV</text>
    <text x="82" y="224" fill="#dbeafe" font-size="20" letter-spacing="4">FULL STACK  •  AI  •  ROBOTICS  •  OPEN SOURCE</text>
    <rect x="82" y="248" width="112" height="3" rx="2" fill="#2dd4bf"/>
    <rect x="202" y="248" width="42" height="3" rx="2" fill="#38bdf8" opacity=".65"/>
  </g>

  <g fill="#5eead4">
    <circle class="pulse" cx="32" cy="252" r="4"/>
    <circle class="pulse2" cx="330" cy="208" r="4"/>
    <circle class="pulse" cx="876" cy="110" r="4"/>
    <circle class="pulse2" cx="1023" cy="219" r="4"/>
  </g>
</svg>